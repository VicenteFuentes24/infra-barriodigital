# Explicit ZooKeeper mode: no process.roles, node.id or controller.quorum.voters.
zookeeper.connect=zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
zookeeper.connection.timeout.ms=30000
zookeeper.session.timeout.ms=18000
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL
log.dirs=/var/lib/kafka/data/logs
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
auto.create.topics.enable=false
unclean.leader.election.enable=false
offsets.topic.replication.factor=3
offsets.topic.num.partitions=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
transaction.state.log.num.partitions=3
group.initial.rebalance.delay.ms=1000
num.network.threads=2
num.io.threads=4
num.replica.fetchers=1
log.retention.hours=168
log.retention.bytes=67108864
log.segment.bytes=16777216
log.roll.ms=3600000
log.retention.check.interval.ms=60000
log.cleanup.policy=delete
delete.topic.enable=false
