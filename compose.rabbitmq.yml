name: barriodigital-rabbitmq

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.6-management}
    hostname: barriodigital-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Define RABBITMQ_DEFAULT_USER para uso local}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Define RABBITMQ_DEFAULT_PASS para uso local}
      RABBITMQ_DEFAULT_VHOST: barriodigital
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    networks:
      - barriodigital-net

  rabbitmq-topology:
    image: ${RABBITMQ_TOPOLOGY_IMAGE:-curlimages/curl:8.21.0}
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Define RABBITMQ_DEFAULT_USER para uso local}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Define RABBITMQ_DEFAULT_PASS para uso local}
    volumes:
      - type: bind
        source: ./rabbitmq/definitions.json
        target: /config/definitions.json
        read_only: true
        bind:
          create_host_path: false
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl --fail --silent --show-error \
          --retry 10 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
          --connect-timeout 5 --max-time 15 \
          --user "$$RABBITMQ_DEFAULT_USER:$$RABBITMQ_DEFAULT_PASS" \
          --header 'Content-Type: application/json' \
          --data-binary @/config/definitions.json \
          --output /dev/null \
          http://rabbitmq:15672/api/definitions
        echo 'Topologia BarrioDigital importada correctamente.'
    read_only: true
    restart: "no"
    networks:
      - barriodigital-net

volumes:
  rabbitmq-data:

networks:
  barriodigital-net:
    name: ${BARRIODIGITAL_NETWORK_NAME:-infra-barriodigital_barriodigital-net}
    external: true
