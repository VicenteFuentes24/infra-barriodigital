# EC2 Linux host networking: AMQP and Erlang only bind the configured private IP.
listeners.tcp.1 = $(RABBITMQ_BIND_IP):5672
distribution.listener.interface = $(RABBITMQ_BIND_IP)
distribution.listener.port_range.min = 25672
distribution.listener.port_range.max = 25672
# Management is available ONLY on the host loopback, including through an SSH tunnel.
management.tcp.ip = 127.0.0.1
management.tcp.port = 15672
disk_free_limit.absolute = 1GB
vm_memory_high_watermark.relative = 0.6
# Do not auto-import definitions or change queue types/partition handling here.
